# TraceForge Desktop CI/CD Pipeline
# GitHub Actions workflow for building, testing, and releasing

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # --------------------------------------------------------------------------
  # Lint and Type Check
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Desktop/package-lock.json

      - name: Install dependencies
        working-directory: ./Desktop
        run: npm ci

      - name: Run ESLint
        working-directory: ./Desktop
        run: npm run lint --if-present

      - name: Run TypeScript check
        working-directory: ./Desktop
        run: npx tsc --noEmit

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Run cargo fmt check
        working-directory: ./Desktop/src-tauri
        run: cargo fmt -- --check

      - name: Run cargo clippy
        working-directory: ./Desktop/src-tauri
        run: cargo clippy -- -D warnings

  # --------------------------------------------------------------------------
  # Unit Tests
  # --------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Desktop/package-lock.json

      - name: Install dependencies
        working-directory: ./Desktop
        run: npm ci

      - name: Run frontend unit tests
        working-directory: ./Desktop
        run: npm test -- --run --coverage

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        working-directory: ./Desktop/src-tauri
        run: cargo test --verbose

      - name: Upload coverage to Codecov (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          files: ./Desktop/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # --------------------------------------------------------------------------
  # E2E Tests
  # --------------------------------------------------------------------------
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Desktop/package-lock.json

      - name: Install dependencies
        working-directory: ./Desktop
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./Desktop
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: ./Desktop
        run: npm run test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: Desktop/playwright-report/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Build
  # --------------------------------------------------------------------------
  build:
    name: Build Application
    needs: [lint, unit-tests, e2e-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: traceforge-linux-amd64
            ext: ''
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: traceforge-linux-arm64
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: traceforge-windows-amd64
            ext: '.exe'
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: traceforge-macos-amd64
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: traceforge-macos-arm64
            ext: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Desktop/package-lock.json

      - name: Install dependencies
        working-directory: ./Desktop
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust cross-compilation tools (Linux ARM64)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Tauri application
        working-directory: ./Desktop
        run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact }}
          path: |
            Desktop/src-tauri/target/${{ matrix.target }}/release/bundle/*/
            Desktop/src-tauri/target/${{ matrix.target }}/release/TraceForge${{ matrix.ext }}
          retention-days: 7

  # --------------------------------------------------------------------------
  # Release (only on release events)
  # --------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build]
    if: github.event_name == 'release' && github.event.action == 'created'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.*
            artifacts/**/bundle/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # Security Scanning
  # --------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './Desktop'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # --------------------------------------------------------------------------
  # Dependency Review
  # --------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v3
        with:
          fail-on-severity: moderate
